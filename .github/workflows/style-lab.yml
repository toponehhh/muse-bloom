name: Test and deploy Muse Bloom
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muse-bloom-current-${{ github.ref }}
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  style-room:
    # Keep Chromium sandboxing enabled. Ubuntu 24.04's hosted AppArmor policy
    # blocks the unprivileged user namespaces used by Playwright Chromium.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:feedback-api
      - run: npm run test:feedback-attachments
      - run: npm run test:style
      - name: Release progression and Pages feedback with isolated D1 and R2
        run: npm run test:style-release
      - name: Main release routing and retired preview redirect
        run: node dev/production-routing.test.js
      - name: Standalone CrazyGames upload, sandboxed iframe and official viewport sizes
        run: npm run test:style-crazygames
      - name: Keep screenshots and contact checks
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: style-room-ui-evidence
          path: |
            artifacts/style-lab/
            artifacts/style-release/
            artifacts/style-crazygames/
            artifacts/campaign/
            artifacts/campaign-rendering/
            artifacts/campaign-stories/
            artifacts/campaign-feedback/
            artifacts/wearable-fit/
            artifacts/waist-fit/
          retention-days: 14
      - name: Keep the current Style Stories CrazyGames upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: muse-bloom-style-stories-crazygames
          path: |
            dist/crazygames-style-stories-v*/
            dist/crazygames-style-stories-v*.manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep the tested Cloudflare preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: muse-bloom-style-room-pages
          path: dist/style-room-pages/
          if-no-files-found: error
      - name: Package the feedback service assets from the same commit
        run: npm run package:cloudflare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: muse-bloom-feedback-service
          path: dist/cloudflare/
          if-no-files-found: error
          retention-days: 14
      - name: Keep the playable demo
        uses: actions/upload-artifact@v7.0.2
        with:
          name: muse-bloom-style-room
          path: dist/style-lab/
          if-no-files-found: error
          retention-days: 14
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && !contains(github.event.head_commit.message, '[skip deploy]')
    needs: style-room
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://muse-bloom.pages.dev
    concurrency:
      group: muse-bloom-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: muse-bloom-style-room-pages
          path: dist/style-room-pages/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: muse-bloom-feedback-service
          path: dist/cloudflare/
      - name: Verify the tested artifact before publishing
        run: node dev/package-style-lab.js --verify
      - name: Deploy the current game and feedback service from main
        run: node dev/cloudflare-command.js deploy
      - name: Redirect the retired preview alias to the main site
        run: |
          node dev/package-style-redirects.js
          node node_modules/wrangler/bin/wrangler.js pages deploy --cwd cloudflare/retired-preview --project-name muse-bloom --branch style-room --commit-hash "$GITHUB_SHA"
