name: Test and deploy Muse Bloom
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muse-bloom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rules, saves and 36-level solvability
        run: npm test
      - name: Install pinned browser test tools
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Feedback API against an isolated local D1
        run: npm run test:feedback-api
      - name: Separate human feedback from simulations and unverified imports
        run: npm run test:feedback-kind
      - name: Online feedback, D1 receipts and safe retries
        run: npm run test:cloudflare
      - name: Initial action visibility, touch targets and feedback dialogs
        run: npm run test:playtest-ui
      - name: Check Cloudflare Worker and asset bindings without deploying
        run: npx wrangler deploy --dry-run --outdir artifacts/cloudflare-worker
      - name: Wardrobe UI and visual regression
        run: npm run test:ui
      - name: Clothing coverage, all separate combinations and unobstructed shoes
        run: npm run test:fitting
      - name: Neckline contact and covered basic straps on every character
        run: npm run test:neckline
      - name: Single-file portal upload and missing-resource regression
        run: npm run test:upload
      - name: Lookbook persistence, portrait export and responsive UI
        run: npm run test:lookbook
      - name: Current UI, text contrast and seven responsive layouts
        run: npm run test:glam
      - name: Character motion and Web Audio lifecycle
        run: npm run test:experience
      - name: Offline private playtest kit and feedback export
        run: npm run test:playtest
      - name: Build and test Pages at a repository subpath
        run: npm run test:pages
      - name: Keep UI evidence and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-evidence
          path: |
            artifacts/v1.7.0/
            artifacts/ui/
            artifacts/characters/
            artifacts/fitting/
            artifacts/neckline/
            artifacts/upload/
            artifacts/lookbook/
            artifacts/experience/
            artifacts/glam/
            artifacts/pages/
            artifacts/cloudflare/
            artifacts/playtest-ui/
      - name: Check generated art stays reproducible
        run: |
          npm run assets
          git diff --exit-code -- assets/ js/asset-data.js
      - name: Create CrazyGames archive
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: muse-bloom-crazygames
          path: |
            dist/muse-bloom-crazygames-*.zip
            dist/package-manifest.json
            dist/crazygames-upload/
          if-no-files-found: error
      - name: Keep the tested website for download
        uses: actions/upload-artifact@v4
        with:
          name: muse-bloom-website
          path: dist/github-pages/
          if-no-files-found: error
      - name: Keep the tested Cloudflare website
        uses: actions/upload-artifact@v4
        with:
          name: muse-bloom-cloudflare
          path: dist/cloudflare/
          if-no-files-found: error
      - name: Upload the tested Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/github-pages/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish the verified website
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    concurrency:
      group: muse-bloom-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: muse-bloom-cloudflare
          path: dist/cloudflare/
      - name: Apply D1 migrations and deploy the tested artifact
        run: node dev/cloudflare-command.js deploy
