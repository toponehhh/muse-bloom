name: Verify game and prepare upload
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules, saves and 36-level solvability
        run: npm test
      - name: Install pinned browser test tools
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Wardrobe UI and visual regression
        run: npm run test:ui
      - name: Single-file portal upload and missing-resource regression
        run: npm run test:upload
      - name: Lookbook persistence, portrait export and responsive editorial UI
        run: npm run test:lookbook
      - name: Keep UI evidence and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-evidence
          path: |
            artifacts/ui/
            artifacts/upload/
            artifacts/lookbook/
      - name: Check generated art stays reproducible
        run: |
          npm run assets
          git diff --exit-code -- assets/ js/asset-data.js
      - name: Create CrazyGames archive
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: muse-bloom-crazygames
          path: dist/
          if-no-files-found: error
